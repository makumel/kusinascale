<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background subtle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FBF8F2" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Squircle Base for High Contrast in Light/Dark Browser Tabs -->
  <rect x="2" y="2" width="96" height="96" rx="24" fill="url(#bgGrad)" stroke="#E7E5E4" stroke-width="2.5" />

  <!-- Fresh Green Bay Leaves -->
  <g transform="translate(62, 14) rotate(18) scale(0.68)">
    <!-- Right leaf -->
    <path d="M 12 18 C 28 6, 40 14, 44 26 C 36 34, 20 32, 12 18 Z" fill="#15803D" stroke="#14532D" stroke-width="1.5" />
    <path d="M 14 19 Q 28 22 40 25" stroke="#86EFAC" stroke-width="1.2" fill="none" stroke-linecap="round" />
    <!-- Left leaf -->
    <path d="M 6 22 C 14 2, 28 2, 32 12 C 26 22, 14 24, 6 22 Z" fill="#22C55E" stroke="#15803D" stroke-width="1.5" />
    <path d="M 8 20 Q 18 12 28 12" stroke="#DCFCE7" stroke-width="1.2" fill="none" stroke-linecap="round" />
  </g>

  <!-- Chef Hat (Toque) perched on K -->
  <g transform="translate(24, 8) scale(0.72)" filter="url(#softShadow)">
    <!-- Puffy Toque Crown -->
    <path d="M 16 34 
             C 10 32, 4 24, 8 16 
             C 11 8, 20 8, 25 12 
             C 28 4, 38 4, 42 10 
             C 48 4, 58 8, 58 16 
             C 62 24, 56 32, 50 34 
             Z" 
          fill="#FFFFFF" 
          stroke="#1C1917" 
          stroke-width="3" 
          stroke-linejoin="round" />
    <!-- Hat Pleat Creases -->
    <path d="M 25 14 Q 28 26 28 34" stroke="#D6D3D1" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 42 12 Q 40 24 38 34" stroke="#D6D3D1" stroke-width="2" fill="none" stroke-linecap="round" />
    <!-- Hat Band -->
    <path d="M 17 34 L 49 34 L 47 41 L 19 41 Z" 
          fill="#FFFFFF" 
          stroke="#1C1917" 
          stroke-width="3" 
          stroke-linejoin="round" />
  </g>

  <!-- Iconic Calligraphic 'K' Body -->
  <g filter="url(#softShadow)">
    <path d="M 33 34 
             C 32 40, 31 52, 30 65 
             C 29 74, 28 80, 26 84 
             C 24 87, 21 87, 19 86 
             C 17 84, 18 80, 21 76 
             C 25 70, 26 62, 28 52 
             C 29 44, 31 38, 33 34 Z" 
          fill="#1C1917" />

    <!-- Main Stem of K -->
    <path d="M 28 44 
             C 32 42, 38 42, 43 45 
             C 45 46, 44 50, 40 52 
             C 35 55, 30 56, 26 56 
             Z" 
          fill="#1C1917" />

    <!-- Upper Loop & Swash of K -->
    <path d="M 40 52 
             C 46 44, 55 35, 64 34 
             C 71 33, 75 36, 75 41 
             C 75 48, 67 56, 53 62 
             C 48 64, 43 65, 38 65 
             C 44 61, 56 55, 63 50 
             C 67 47, 69 44, 68 41 
             C 67 39, 64 39, 59 42 
             C 52 46, 45 52, 40 58 Z" 
          fill="#1C1917" />

    <!-- Lower Flourish Leg of K -->
    <path d="M 48 61 
             C 55 67, 63 74, 71 78 
             C 76 81, 80 82, 82 80 
             C 84 78, 83 75, 78 72 
             C 70 68, 62 61, 55 56 
             C 52 58, 49 60, 48 61 Z" 
          fill="#1C1917" />
  </g>
</svg>
